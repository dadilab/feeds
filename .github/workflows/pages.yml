name: Publish RSS feeds to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    # * is a special character in YAML so you have to quote this string
    # Run every day at 5:30 and 17:30:
    - cron:  '0 */6 * * *'
  workflow_dispatch:

env:
  CI: true
jobs:
  publish-feeds:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4        # 升级：原 v2.3.4（Node20 弃用，被强升 Node24）
    # 替代已弃用的 microsoft/playwright-github-action@v1
    # 锁定到与 feed-me-up-scotty@1.10.0 的 playwright-firefox@^1.16.3 匹配的版本，
    # 否则用最新 playwright 装的 Firefox revision 与工具期望的不一致，浏览器会起不来。
    - name: Install Playwright Firefox
      run: npx --yes playwright@1.16.3 install --with-deps firefox
    # feeds.toml 已设 onFail，单站失败不再中断整次运行，无需 || 三重重试
    - name: Generate feeds
      run: npx --yes feed-me-up-scotty@1.10.0
    - name: Deploy to GitHub Pages
      run: |
        git config user.name $GITHUB_ACTOR
        git config user.email $GITHUB_ACTOR@users.noreply.github.com
        git remote add gh-pages-remote https://x-access-token:$GITHUB_TOKEN@github.com/$GITHUB_REPOSITORY.git
        git fetch --no-recurse-submodules
        git worktree add ./gh-pages gh-pages
        cd gh-pages
        git rm -r .
        cp -r ../public/. .
        git add .
        git commit --message="Deploying to GitHub Pages from $GITHUB_SHA"
        git push gh-pages-remote gh-pages:gh-pages
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPOSITORY: ${{ github.repository }}
